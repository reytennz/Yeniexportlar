<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ox Inventory</title>
    <style>
      @font-face {
        font-family: 'Roboto';
        src: url('./assets/SFUIText-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Roboto';
        src: url('./assets/SFUIText-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'Roboto';
        src: url('./assets/SFUIText-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      * {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        background: transparent !important;
      }
    </style>
    <script>
      // MTA:SA CEF Bridge for React NUI
      window.invokeNative = true;
      window.GetParentResourceName = () => "gzl_inventory";

      let uiLoadedFired = false;
      window.sendNuiMessage = function(raw) {
        let payload = raw;
        if (typeof raw === "string") {
          try {
            payload = JSON.parse(raw);
          } catch (e) {}
        }
        if (Array.isArray(payload) && payload.length > 0 && payload[0] && payload[0].action) {
          payload = payload[0];
        }
        window.postMessage(payload, "*");
      };

      const _origFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === "string" && (url.includes("ox_inventory") || url.includes("cfx-nui") || url.startsWith("http://") || url.startsWith("https://"))) {
          const parts = url.split("/");
          const eventName = parts[parts.length - 1];
          const payload = (options && options.body !== undefined) ? options.body : "{}";

          if (eventName === "uiLoaded") {
            if (uiLoadedFired) return Promise.resolve(new Response(JSON.stringify({ ok: true })));
            uiLoadedFired = true;
          }

          if (eventName === "exit" || eventName === "closeInventory") {
            window.postMessage({ action: "closeInventory" }, "*");
            window.postMessage({ action: "setInventoryVisible", data: false }, "*");
          }

          if (window.mta && window.mta.triggerEvent) {
            mta.triggerEvent("ox_inventory:onNuiCallback", eventName, typeof payload === "string" ? payload : JSON.stringify(payload));
          }
          return Promise.resolve(new Response(JSON.stringify({ ok: true })));
        }
        return _origFetch.apply(this, arguments);
      };

      window.addEventListener("keydown", function(e) {
        if (e.key === "Escape" || e.code === "Escape" || e.keyCode === 27) {
          window.postMessage({ action: "closeInventory" }, "*");
          window.postMessage({ action: "setInventoryVisible", data: false }, "*");
          if (window.mta && window.mta.triggerEvent) {
            mta.triggerEvent("ox_inventory:onNuiCallback", "exit", "{}");
          }
        }
      });
    </script>
    
    
    <script type="module" crossorigin src="./assets/app-bundle.js"></script>
    <link rel="stylesheet" href="./assets/app-style.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
