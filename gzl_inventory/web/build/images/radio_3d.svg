<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180" fill="none">
    <defs>
        <radialGradient id="radioHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#C084FC" stop-opacity="0.14"/>
            <stop offset="60%" stop-color="#C084FC" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="radioBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DDD6FE"/>
            <stop offset="100%" stop-color="#C4B5FD"/>
        </linearGradient>
        <filter id="radioShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
        </filter>
    </defs>
    <ellipse cx="100" cy="100" rx="90" ry="75" fill="url(#radioHalo)"/>
