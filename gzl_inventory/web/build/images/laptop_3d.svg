<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180" fill="none">
    <defs>
        <radialGradient id="laptopHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
            <stop offset="60%" stop-color="#6366F1" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
        </radialGradient>
        <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
        </filter>
    </defs>
    <ellipse cx="100" cy="95" rx="95" ry="80" fill="url(#laptopHalo)"/>
    <g filter="url(#laptopShadow)">
        <polygon points="45,40 155,30 150,105 40,115" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
        <polygon points="50,45 150,36 146,100 46,109" fill="#F1F5F9"/>
        <polygon points="40,115 150,105 168,145 22,155" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
        <polygon points="44,117 146,108 160,140 30,149" fill="#06B6D4"/>
        <polygon points="80,142 110,139 113,149 83,152" fill="#0891B2"/>
    </g>
</svg>
